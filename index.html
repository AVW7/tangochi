<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TANGOCHI</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0c10;
    --bg2:     #10131a;
    --bg3:     #181c26;
    --border:  #1e2330;
    --text:    #dde2ee;
    --text2:   #6070a0;
    --accent:  #44dd88;
    --accent2: #22aa55;
    --px: 'Press Start 2P', monospace;
    --glow: 0 0 12px var(--accent);
    --transition: 0.3s ease;
  }

  /* Mood themes */
  .mood-happy      { --accent:#44dd88; --accent2:#22aa55; }
  .mood-excited    { --accent:#ffcc00; --accent2:#cc8800; }
  .mood-focused    { --accent:#44aaff; --accent2:#2277dd; }
  .mood-sad        { --accent:#9966dd; --accent2:#663baa; }
  .mood-sleeping   { --accent:#558898; --accent2:#335566; }
  .mood-celebrating{ --accent:#ff55cc; --accent2:#cc22aa; }
  .mood-angry      { --accent:#ff4444; --accent2:#cc1111; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  #app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 20px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: var(--glow);
    transition: color var(--transition), text-shadow var(--transition);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    background: var(--bg2);
    border: 1px solid var(--border);
    font-size: 8px;
    color: var(--accent);
    padding: 5px 10px;
    letter-spacing: 1px;
    transition: color var(--transition), border-color var(--transition);
  }

  /* ── PET CARD ── */
  .pet-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 28px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.3s;
  }

  .pet-card:hover { border-color: var(--accent); }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    transition: background var(--transition), box-shadow var(--transition);
  }

  .pet-viewport {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #petCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    filter: drop-shadow(0 4px 16px var(--accent));
    transition: filter var(--transition);
  }

  .speech-bubble {
    position: absolute;
    top: -56px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    font-size: 7px;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, border-color var(--transition);
    z-index: 10;
  }

  .speech-bubble.show { opacity: 1; }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--accent);
    transition: border-top-color var(--transition);
  }

  .pet-info {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .species-name {
    font-size: 10px;
    color: var(--text);
    letter-spacing: 2px;
  }

  .species-emoji {
    font-size: 9px;
    color: var(--accent);
    font-family: 'Courier New', monospace;
    transition: color var(--transition);
  }

  .mood-badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 7px;
    padding: 4px 10px;
    letter-spacing: 1px;
    transition: background var(--transition);
  }

  /* ── STATUS ROW ── */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 7px;
    color: var(--text2);
    gap: 8px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    transition: background var(--transition), box-shadow var(--transition);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── STATS ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px;
  }

  .card-title {
    font-size: 7px;
    color: var(--text2);
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat-row:last-child { margin-bottom: 0; }

  .stat-label {
    font-size: 7px;
    color: var(--text2);
    width: 68px;
    flex-shrink: 0;
  }

  .stat-track {
    flex: 1;
    height: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }

  .stat-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.6s ease, background var(--transition);
    position: relative;
  }

  .stat-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0;
    width: 2px; height: 100%;
    background: rgba(255,255,255,0.5);
  }

  .stat-num {
    font-size: 7px;
    color: var(--text2);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
    font-family: 'Courier New', monospace;
  }

  /* ── XP BAR ── */
  .xp-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .xp-label { font-size: 7px; color: var(--text2); }

  .xp-track {
    flex: 1;
    height: 4px;
    background: var(--bg3);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.8s ease, background var(--transition);
    box-shadow: 0 0 6px var(--accent);
  }

  /* ── ACTIONS ── */
  .actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--px);
    font-size: 7px;
    padding: 13px 6px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    line-height: 1.4;
    letter-spacing: 1px;
  }

  .btn-icon { font-size: 14px; }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg3);
    box-shadow: inset 0 0 16px rgba(68,221,136,0.06);
  }

  .btn:active { transform: translateY(1px); }

  .btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg3);
  }

  /* ── SPECIES SELECTOR ── */
  .species-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .sp-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 10px 4px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .sp-emoji {
    font-size: 10px;
    font-family: 'Courier New', monospace;
    color: var(--text2);
    line-height: 1;
  }

  .sp-name {
    font-family: var(--px);
    font-size: 5px;
    color: var(--text2);
    letter-spacing: 0;
  }

  .sp-btn:hover, .sp-btn.active {
    border-color: var(--accent);
    background: var(--bg2);
  }

  .sp-btn.active .sp-emoji,
  .sp-btn.active .sp-name { color: var(--accent); }

  /* ── FOOTER ── */
  .footer {
    font-size: 6px;
    color: var(--text2);
    text-align: center;
    padding: 6px;
    letter-spacing: 1px;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--bg3);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 7px;
    padding: 10px 20px;
    letter-spacing: 1px;
    transition: transform 0.3s ease, opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }

  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>

    <div class="xp-row">

      <div class="xp-label" id="xpLabel">0/100</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="doFeed()">
      <span class="btn-icon">🍖</span>FEED
    </button>
    <button class="btn" onclick="doPlay()">
      <span class="btn-icon">🎮</span>PLAY
    </button>
    <button class="btn" onclick="doRest()">
      <span class="btn-icon">💤</span>REST
    </button>
    <button class="btn" onclick="doDebug()">
      <span class="btn-icon">🐛</span>DEBUG
    </button>
  </div>

  <div class="card">
    <div class="card-title">// SELECT SPECIES</div>
    <div class="species-grid" id="speciesGrid"></div>
  </div>

  <div class="footer" id="footerInfo">tangochi v1.0 — click your pet to interact</div>
</div>

<div id="toast"></div>

const SPECIES_ORDER = ['robot','cat','ghost','mushroom','axolotl','capybara','dragon','owl','fox','penguin','slime','phoenix'];

// MOOD & STATE
// ═══════════════════════════════════════════════════════════

const MOODS = {

  excited:     { label:'EXCITED !!',  color:'#ffcc00', body: '' },
  focused:     { label:'FOCUSED ...',  color:'#44aaff', body: '' },
  sad:         { label:'SAD :(',      color:'#9966dd', body: '' },
  sleeping:    { label:'ZZZ...',      color:'#558898', body: '' },
  celebrating: { label:'WOOHOO!',     color:'#ff55cc', body: '' },
  angry:       { label:'ANGRY >:(',   color:'#ff4444', body: '' },
};

const SPEECHES = {
  happy:       ['hello there!','feeling good!','let\'s code!','ready!','👾'],
  excited:     ['YES!!','LETS GO!!','so pumped!!','whoa!!','!!!'],
  focused:     ['...working','in the zone','deep focus','...','shhh.'],
  sad:         ['test failed :(','bug not fixed...','need help','low energy','oh no'],
  sleeping:    ['zzz...','*snore*','zZzZ','dreaming of code','zzzzz'],

function defaultState() {
  return {
    species:  'robot',
    level:    1,
    xp:       0,
    mood:     'happy',
    stats:    { debugging:50, patience:50, chaos:30, wisdom:60, speed:55 },
    lastFed:  null,
    sessions: 1,
    created:  Date.now(),
  };
}

let STATE = loadState();
let animFrame = 0;
let animTick  = 0;
let animSpeed = 30; // ticks per frame switch
let bounceY   = 0;
let bounceTick= 0;
let bubbleTimer = null;

function loadState() {
  try {
    const saved = localStorage.getItem('tangochi');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem('tangochi', JSON.stringify(STATE));
}

// ═══════════════════════════════════════════════════════════
// CANVAS RENDERER
// ═══════════════════════════════════════════════════════════

const canvas = document.getElementById('petCanvas');
const ctx    = canvas.getContext('2d');
const SCALE  = 10; // 10px per pixel → 16×16 × 10 = 160×160

function drawSprite(species, frameIdx, offsetY = 0) {
  const sp = SPECIES[species];
  if (!sp) return;
  const frame  = sp.frames[frameIdx % sp.frames.length];
  const colors = sp.colors;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < frame.length; i++) {
    const v = frame[i];
    if (v === 0) continue;
    const px = (i % 16) * SCALE;
    const py = Math.floor(i / 16) * SCALE + offsetY;
    ctx.fillStyle = colors[v] || '#fff';
    ctx.fillRect(px, py, SCALE, SCALE);
  }

  // Sleeping: draw zzz
  if (STATE.mood === 'sleeping') {
    ctx.fillStyle = '#aabbcc';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('z', 120, 20 + Math.sin(Date.now()/800)*4);
    ctx.font = 'bold 8px monospace';
    ctx.fillText('z', 132, 10 + Math.sin(Date.now()/600)*3);
    ctx.font = 'bold 6px monospace';
    ctx.fillText('z', 140, 4);
  }

  // Celebrating: sparkles
  if (STATE.mood === 'celebrating') {
    const t = Date.now();
    const sparkles = [[10,8],[145,12],[5,100],[150,90],[75,5]];
    sparkles.forEach(([x,y],i) => {
      const o = (Math.sin(t/300+i*1.2)+1)/2;
      ctx.globalAlpha = o;
      ctx.fillStyle = '#ffe040';
      ctx.fillText('✦', x, y + Math.sin(t/400+i)*3);
    });
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════

function tick() {
  animTick++;

  // Bounce speed by mood
  const speeds = { excited:10, celebrating:12, angry:8, happy:30, focused:50, sleeping:120, sad:60 };
  const spd = speeds[STATE.mood] || 30;

  bounceTick++;
  const bounceAmp = STATE.mood === 'sleeping' ? 0 : (STATE.mood === 'excited' ? 3 : 2);
  bounceY = Math.round(Math.sin(bounceTick / (spd / Math.PI)) * bounceAmp);

  // Frame switch
  if (animTick % spd === 0) {
    animFrame = (animFrame + 1) % 2;
  }

  drawSprite(STATE.species, animFrame, bounceY);
  requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════════════════
// MOOD CALCULATION
// ═══════════════════════════════════════════════════════════

function recalcMood() {
  const s = STATE.stats;
  const avg = (s.debugging + s.patience + s.chaos + s.wisdom + s.speed) / 5;

  // Time since fed
  const hoursSinceFed = STATE.lastFed
    ? (Date.now() - STATE.lastFed) / 3600000
    : 999;

  if (hoursSinceFed > 24) return 'sad';

  const dominantStat = Object.entries(s)
    .sort((a,b) => b[1]-a[1])[0][0];

  if (s.chaos > 80) return 'angry';
  if (avg > 80)     return 'celebrating';
  if (s.patience > 70 && s.wisdom > 60) return 'focused';
  if (s.speed > 75 && s.debugging > 60) return 'excited';
  if (avg > 55)     return 'happy';
  if (avg < 25)     return 'sleeping';
  return 'focused';
}

// ═══════════════════════════════════════════════════════════
// UI UPDATES
// ═══════════════════════════════════════════════════════════

function updateUI() {
  const sp = SPECIES[STATE.species];
  const mood = STATE.mood;
  const moodData = MOODS[mood];

  // Pet info
  document.getElementById('speciesName').textContent  = sp.name;
  document.getElementById('speciesEmoji').textContent = sp.emoji;
  document.getElementById('moodBadge').textContent    = moodData.label;

  // Level
  const xpNeeded = STATE.level * 100;
  document.getElementById('levelBadge').textContent = `LVL ${STATE.level}`;

  // Stats
  const statKeys = ['debugging','patience','chaos','wisdom','speed'];
  statKeys.forEach(k => {
    const v = Math.round(STATE.stats[k]);
    document.getElementById(`sf-${k}`).style.width = `${v}%`;
    document.getElementById(`sv-${k}`).textContent = v;
  });

  // XP
  const xpNeededTotal = STATE.level * 100;
  const xpPct = Math.min(100, (STATE.xp / xpNeededTotal) * 100);
  document.getElementById('xpFill').style.width = `${xpPct}%`;
  document.getElementById('xpLabel').textContent = `${STATE.xp}/${xpNeededTotal}`;

  // Mood theme
  document.body.className = `mood-${mood}`;

  // Status info
  document.getElementById('sessionInfo').textContent = `sessions: ${STATE.sessions}`;
  const fedStr = STATE.lastFed
    ? timeSince(STATE.lastFed)
    : 'never';
  document.getElementById('lastFed').textContent = `fed: ${fedStr}`;

  const statusLabels = {
    happy:'IDLE', excited:'ACTIVE', focused:'WORKING',
    sad:'RESTING', sleeping:'SLEEPING', celebrating:'SHIPPING', angry:'DEBUGGING'
  };
  document.getElementById('statusText').textContent = statusLabels[mood] || 'IDLE';

  // Species grid active
  document.querySelectorAll('.sp-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sp === STATE.species);
  });

  saveState();
}

function timeSince(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1)   return 'just now';
  if (mins < 60)  return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)   return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

function gainXP(amount) {
  STATE.xp += amount;
  const needed = STATE.level * 100;
  if (STATE.xp >= needed) {
    STATE.xp -= needed;
    STATE.level++;
    showToast(`⬆ LEVEL UP! LVL ${STATE.level}`);
  }
}

// ═══════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════

function doFeed() {
  STATE.stats.patience  = Math.min(100, STATE.stats.patience  + 15);
  STATE.stats.speed     = Math.min(100, STATE.stats.speed     + 8);
  STATE.stats.debugging = Math.min(100, STATE.stats.debugging + 5);
  STATE.lastFed = Date.now();
  gainXP(10);
  STATE.mood = recalcMood();
  updateUI();
  showSpeech('thanks for the food!');
  showToast('🍖 FED +patience +speed');
  flashBtn(document.querySelector('.btn'));
}

function doPlay() {
  STATE.stats.chaos   = Math.min(100, STATE.stats.chaos   + 10);
  STATE.stats.speed   = Math.min(100, STATE.stats.speed   + 12);
  STATE.stats.wisdom  = Math.max(0,   STATE.stats.wisdom  - 5);
  gainXP(15);
  STATE.mood = 'excited';
  setTimeout(() => { STATE.mood = recalcMood(); updateUI(); }, 4000);
  updateUI();
  showSpeech('yay!! let\'s play!!');
  showToast('🎮 PLAYED +chaos +speed');
}

function doRest() {
  STATE.stats.patience  = Math.min(100, STATE.stats.patience  + 20);
  STATE.stats.wisdom    = Math.min(100, STATE.stats.wisdom    + 10);
  STATE.stats.chaos     = Math.max(0,   STATE.stats.chaos     - 15);
  STATE.stats.speed     = Math.max(0,   STATE.stats.speed     - 5);
  gainXP(8);
  STATE.mood = 'sleeping';
  setTimeout(() => { STATE.mood = recalcMood(); updateUI(); }, 5000);
  updateUI();
  showSpeech('zzzz...');
  showToast('💤 RESTING +patience +wisdom');
}

function doDebug() {
  STATE.stats.debugging = Math.min(100, STATE.stats.debugging + 20);
  STATE.stats.wisdom    = Math.min(100, STATE.stats.wisdom    + 10);
  STATE.stats.chaos     = Math.max(0,   STATE.stats.chaos     - 10);
  gainXP(20);
  STATE.mood = 'angry';
  setTimeout(() => { STATE.mood = 'focused'; updateUI(); }, 3000);
  setTimeout(() => { STATE.mood = recalcMood(); updateUI(); }, 7000);
  updateUI();
  showSpeech('found the bug!!');
  showToast('🐛 DEBUGGING +debugging +wisdom');
}

function petClick() {
  const speeches = SPEECHES[STATE.mood] || SPEECHES.happy;
  const msg = speeches[Math.floor(Math.random() * speeches.length)];
  showSpeech(msg);
  gainXP(2);
  STATE.sessions++;
  updateUI();
}

// ═══════════════════════════════════════════════════════════
// SPEECH BUBBLE & TOAST
// ═══════════════════════════════════════════════════════════

function showSpeech(text) {
  const el = document.getElementById('speechBubble');
  el.textContent = text;
  el.classList.add('show');
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function flashBtn(btn) {
  if (!btn) return;
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 400);
}

// ═══════════════════════════════════════════════════════════
// SPECIES GRID BUILDER
// ═══════════════════════════════════════════════════════════

function buildSpeciesGrid() {
  const grid = document.getElementById('speciesGrid');
  grid.innerHTML = '';
  SPECIES_ORDER.forEach(key => {
    const sp = SPECIES[key];
    const btn = document.createElement('div');
    btn.className = 'sp-btn' + (key === STATE.species ? ' active' : '');
    btn.dataset.sp = key;
    btn.innerHTML = `<span class="sp-emoji">${sp.emoji}</span><span class="sp-name">${sp.name}</span>`;
    btn.onclick = () => {
      STATE.species = key;
      STATE.mood = recalcMood();
      animFrame = 0;
      updateUI();
      showSpeech(`i\'m ${sp.name.toLowerCase()}!`);
    };
    grid.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════
// DECAY (stats drift over time)
// ═══════════════════════════════════════════════════════════

function applyDecay() {
  // Very gentle passive decay
  STATE.stats.patience  = Math.max(0, STATE.stats.patience  - 0.5);
  STATE.stats.speed     = Math.max(0, STATE.stats.speed     - 0.3);
  STATE.mood = recalcMood();
  updateUI();
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

buildSpeciesGrid();
updateUI();
tick();

// Decay every 5 minutes
setInterval(applyDecay, 5 * 60 * 1000);

// Welcome
setTimeout(() => {
  showSpeech(`hey ${STATE.species === 'robot' ? 'human' : 'friend'}! 👾`);
}, 600);

// Footer
document.getElementById('footerInfo').textContent =
  `tangochi v1.0 · ${SPECIES_ORDER.length} species · click to interact`;
