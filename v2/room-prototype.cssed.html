<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TANGOCHI v2 — Room Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#07080a; --bg-1:#0d0f12; --bg-2:#14171c; --bg-3:#1c2128;
  --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.14);
  --dot-on:#e9e9ec; --dot-dim:rgba(233,233,236,0.26); --dot-off:rgba(255,255,255,0.05);
  --text-0:rgba(255,255,255,0.95); --text-1:rgba(255,255,255,0.60); --text-2:rgba(255,255,255,0.36);
  --accent:#5ee3ff; --warm:#ffb347; --pet:#e8643c;

  /* live room orientation — driven by drag/parallax */
  --ax:58deg;   /* tilt toward viewer */
  --az:-45deg;  /* spin (azimuth)     */

  --tile:72px;
  --grid:5;
  --wall:128px;
  --tint:0;          /* day/night darkness 0..1 */
  --tint-hue:0;      /* warm/cool shift          */
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(94,227,255,0.05), transparent 60%),
    var(--bg-0);
  color:var(--text-0);
  font-family:'JetBrains Mono',monospace;
  overflow:hidden;
}

/* fine background grid */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;}

/* ── layout ── */
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 280px;z-index:1;}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr auto;}}

/* ── stage ── */
.stage-wrap{position:relative;overflow:hidden;}
.fm-tag{position:absolute;top:18px;right:22px;z-index:5;font-size:11px;letter-spacing:.14em;color:var(--text-1);
  display:flex;gap:8px;align-items:center;}
.fm-tag b{font-weight:500;color:var(--text-0);}
.fm-tag .live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);
  animation:pulse 1.6s infinite ease-in-out;}
.title{position:absolute;top:16px;left:22px;z-index:5;}
.title .name{font-family:'Press Start 2P',monospace;font-size:15px;letter-spacing:.02em;}
.title .sub{font-size:10px;letter-spacing:.22em;color:var(--text-2);margin-top:7px;text-transform:uppercase;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.scene{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 42%;cursor:grab;}
.scene.dragging{cursor:grabbing;}

#world{
  position:absolute;left:50%;top:54%;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%) rotateX(var(--ax)) rotateZ(var(--az));
  transition:transform .12s linear;
}
.no-trans #world{transition:none;}

/* the floor is the parent coordinate space (0..grid*tile) */
.floor{
  position:absolute;
  width:calc(var(--grid) * var(--tile));
  height:calc(var(--grid) * var(--tile));
  /* center the floor on the world origin */
  left:calc(var(--grid) * var(--tile) / -2);
  top:calc(var(--grid) * var(--tile) / -2);
  transform-style:preserve-3d;
  background:var(--bg-2);
  background-image:radial-gradient(var(--dot-dim) 1.1px, transparent 1.6px);
  background-size:7px 7px;
  box-shadow:inset 0 0 0 1px var(--line);
}
/* iso grid tiles for placement + faint lines */
.tile{position:absolute;width:var(--tile);height:var(--tile);
  box-shadow:inset 0 0 0 1px var(--line);
  transition:background .15s;}
.tile.hot{background:rgba(94,227,255,0.10);box-shadow:inset 0 0 0 1px rgba(94,227,255,.4);}

/* walls rise out of the floor edges */
.wall{position:absolute;left:0;top:0;
  background:var(--bg-1);
  background-image:radial-gradient(var(--dot-dim) 1.1px, transparent 1.6px);
  background-size:7px 7px;
  box-shadow:inset 0 0 0 1px var(--line);}
.wall.back{width:calc(var(--grid)*var(--tile));height:var(--wall);
  transform-origin:0 0;transform:rotateX(-90deg);}
.wall.left{width:var(--wall);height:calc(var(--grid)*var(--tile));
  transform-origin:0 0;transform:rotateY(-90deg);
  background-image:radial-gradient(rgba(233,233,236,0.18) 1.1px, transparent 1.6px);}
.wall .skirt{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(255,255,255,0.04);}

/* wall art (coplanar with wall) */
.wall-art{position:absolute;}
.wall .window{position:absolute;background:linear-gradient(160deg,#0f1c2e,#1b2c44);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.12), 0 0 24px rgba(94,227,255,.12);}
.wall .window .pane{position:absolute;inset:8px;background-image:
  linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:50% 50%;}
.wall .window .moon{position:absolute;width:18px;height:18px;border-radius:50%;
  right:14px;top:12px;background:radial-gradient(circle at 38% 36%,#fff,#c9d6e6);
  box-shadow:0 0 14px rgba(200,220,255,.6);opacity:calc(0.15 + var(--tint)*0.85);}

/* ── object standees (billboarded to face camera) ── */
.obj{position:absolute;transform-origin:0 0;transform-style:preserve-3d;
  transform:rotateZ(calc(var(--az)*-1)) rotateX(calc(var(--ax)*-1));
  pointer-events:none;}
.obj .card{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
  pointer-events:auto;cursor:pointer;filter:drop-shadow(0 0 0 transparent);
  transition:transform .18s;}
.obj .card:hover{transform:translate(-50%,-104%) scale(1.04);}
.obj svg{display:block;overflow:visible;}
.obj .dot{fill:var(--dot-on);}
.obj .dot.dim{fill:var(--dot-dim);}
.obj .lbl{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-2px);
  font-size:8px;letter-spacing:.12em;color:var(--text-2);white-space:nowrap;opacity:0;transition:opacity .15s;text-transform:uppercase;}
.obj .card:hover .lbl{opacity:1;}

/* lamp glow — the one warmth in the room */
.obj .glow{position:absolute;left:50%;top:0;width:80px;height:80px;border-radius:50%;
  transform:translate(-50%,-60%);pointer-events:none;
  background:radial-gradient(circle,rgba(255,179,71,.55),transparent 68%);
  opacity:calc(0.35 + (1 - var(--tint))*0.0 + var(--tint)*0.65);mix-blend-mode:screen;}

/* flat rug on the floor */
.rug{position:absolute;transform-origin:center;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--bg-3);background-image:radial-gradient(var(--dot-dim) 1.2px,transparent 1.7px);
  background-size:8px 8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);cursor:pointer;pointer-events:auto;}

/* ground shadow (lies on floor) */
.shadow{position:absolute;width:46px;height:46px;border-radius:50%;
  transform:translate(-50%,-50%) scale(1,0.5);background:radial-gradient(circle,rgba(0,0,0,.45),transparent 70%);
  pointer-events:none;}

/* ── pet ── */
.pet{position:absolute;transform-origin:0 0;transform-style:preserve-3d;
  transform:rotateZ(calc(var(--az)*-1)) rotateX(calc(var(--ax)*-1));
  transition:left 1.6s linear, top 1.6s linear;pointer-events:none;z-index:50;}
.pet canvas{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
  image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));}
.pet .speech{position:absolute;left:0;bottom:100%;transform:translate(-50%,-6px);
  background:var(--bg-2);border:1px solid var(--line-strong);border-radius:6px;
  padding:6px 9px;font-size:9px;letter-spacing:.04em;white-space:nowrap;color:var(--text-0);
  box-shadow:0 8px 18px -8px #000;opacity:0;transition:opacity .2s;}
.pet .speech.show{opacity:1;}

/* day/night tint over the whole stage */
.tint{position:absolute;inset:0;pointer-events:none;z-index:60;
  background:rgba(6,8,14,var(--tint));
  box-shadow:inset 0 0 140px 30px rgba(0,0,0,calc(0.25 + var(--tint)*0.4));}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:61;opacity:.35;
  background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 3px);}

/* ── side panel ── */
.panel{background:var(--bg-1);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;}
@media(max-width:820px){.panel{border-left:none;border-top:1px solid var(--line);max-height:42vh;}}
.panel section{padding:16px 18px;border-bottom:1px solid var(--line);}
.panel h2{font-size:10px;letter-spacing:.2em;color:var(--text-2);text-transform:uppercase;margin-bottom:12px;}

/* needs bars */
.need{margin-bottom:10px;}
.need .row{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;
  color:var(--text-1);text-transform:uppercase;margin-bottom:4px;}
.need .bar{height:8px;background:var(--bg-3);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);}
.need .fill{height:100%;width:70%;border-radius:4px;background:var(--dot-on);transition:width .4s, background .4s;}

/* object tray */
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tray button{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;
  padding:10px 4px 8px;cursor:pointer;color:var(--text-1);display:flex;flex-direction:column;
  align-items:center;gap:6px;transition:all .15s;}
.tray button:hover{border-color:var(--line-strong);color:var(--text-0);transform:translateY(-1px);}
.tray button.active{border-color:var(--accent);color:var(--text-0);background:rgba(94,227,255,.07);}
.tray button svg{width:30px;height:34px;}
.tray button .t{font-size:8px;letter-spacing:.08em;text-transform:uppercase;}
.hint{font-size:9px;color:var(--text-2);line-height:1.6;margin-top:10px;}

/* controls */
.ctrl{margin-bottom:14px;}
.ctrl label{display:block;font-size:9px;letter-spacing:.14em;color:var(--text-2);text-transform:uppercase;margin-bottom:6px;}
.ctrl .v{font-family:'Press Start 2P';font-size:9px;color:var(--text-0);float:right;}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:var(--bg-3);outline:none;cursor:pointer;border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--dot-on);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--dot-on);border:none;cursor:pointer;}
.toggle{display:flex;gap:8px;flex-wrap:wrap;}
.toggle button{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;
  padding:9px 6px;cursor:pointer;color:var(--text-1);font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:all .15s;}
.toggle button:hover{border-color:var(--line-strong);color:var(--text-0);}
.toggle button.on{border-color:var(--accent);color:var(--text-0);background:rgba(94,227,255,.07);}
.foot{padding:14px 18px;font-size:9px;color:var(--text-2);letter-spacing:.06em;}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="app">
  <!-- =================== STAGE =================== -->
  <div class="stage-wrap">
    <div class="title">
      <div class="name">TANGOCHI</div>
      <div class="sub">// v2 room · hybrid 3d</div>
    </div>
    <div class="fm-tag"><span class="live"></span>♫ <b>CLAUDE&nbsp;FM</b> · room building</div>

    <div class="scene" id="scene">
      <div id="world">
        <!-- floor is the coordinate origin; walls live inside it so they rise
             from the floor's actual back-left corner (same 0..360 space as tiles) -->
        <div class="floor" id="floor">
          <div class="wall left" id="wallLeft"><div class="skirt"></div></div>
          <div class="wall back" id="wallBack"><div class="skirt"></div></div>
        </div>
      </div>
    </div>

    <div class="tint"></div>
    <div class="scanlines"></div>
  </div>

  <!-- =================== PANEL =================== -->
  <aside class="panel">
    <section>
      <h2>// Needs</h2>
      <div id="needs"></div>
    </section>

    <section>
      <h2>// Object Catalog</h2>
      <div class="tray" id="tray"></div>
      <div class="hint">Pick an object, then click a floor tile to place it. Click a placed object to remove it.</div>
    </section>

    <section>
      <h2>// Room Controls</h2>
      <div class="ctrl">
        <label>Time of Day <span class="v" id="todVal">DAY</span></label>
        <input type="range" id="tod" min="0" max="100" value="20">
      </div>
      <div class="ctrl">
        <label>Camera Tilt <span class="v" id="tiltVal">58</span></label>
        <input type="range" id="tilt" min="46" max="68" value="58">
      </div>
      <div class="ctrl">
        <label>Wall Art</label>
        <div class="toggle">
          <button id="tWindow" class="on">Window</button>
          <button id="tPoster" class="on">Poster</button>
        </div>
      </div>
      <div class="ctrl">
        <label>Motion</label>
        <div class="toggle">
          <button id="tMotion" class="on">Animate</button>
          <button id="tReset">Reset Room</button>
        </div>
      </div>
    </section>

    <div class="foot">drag the room to orbit · monochrome by design · the pet is the only colour</div>
  </aside>
</div>

<script>
/* ============================================================
   TANGOCHI v2 — Hybrid CSS-3D dot-matrix room (prototype)
   Vanilla, no libraries, runs from file://
   ============================================================ */
const SVGNS='http://www.w3.org/2000/svg';
const GRID=5, TILE=72;
const $=s=>document.querySelector(s);

/* ---- dot-matrix art parser ----------------------------------
   '#' = lit dot, '+' = dim dot, ' '/'.' = empty.
   Returns an <svg> of circles, sized to the grid.            */
function dotArt(rows, cell=7, r=2.4){
  const h=rows.length, w=Math.max(...rows.map(s=>s.length));
  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox',`0 0 ${w*cell} ${h*cell}`);
  svg.setAttribute('width', w*cell);
  svg.setAttribute('height', h*cell);
  for(let y=0;y<h;y++){
    const line=rows[y];
    for(let x=0;x<line.length;x++){
      const ch=line[x];
      if(ch!=='#'&&ch!=='+') continue;
      const c=document.createElementNS(SVGNS,'circle');
      c.setAttribute('cx',x*cell+cell/2);
      c.setAttribute('cy',y*cell+cell/2);
      c.setAttribute('r',r);
      c.setAttribute('class','dot'+(ch==='+'?' dim':''));
      svg.appendChild(c);
    }
  }
  return svg;
}

/* ---- object catalog (design-first) -------------------------- */
const DEFS={
  desk:{ name:'Workstation', glow:false, art:[
    ' ######## ',
    ' #++++++# ',
    ' #++++++# ',
    ' #++++++# ',
    ' ######## ',
    '    ##    ',
    '##########',
    '#        #',
    '#        #',
    '#        #',
  ]},
  bookshelf:{ name:'Bookshelf', glow:false, art:[
    '########',
    '#+#+#+ #',
    '#+#+# +#',
    '########',
    '# +#+#+#',
    '#+#+# +#',
    '########',
    '#+ #+#+#',
    '#+#+#+ #',
    '########',
  ]},
  plant:{ name:'Monstera', glow:false, art:[
    '   #  #   ',
    '  ## ##   ',
    ' #### ##  ',
    '# #####  #',
    ' ## ##### ',
    '  #### ## ',
    '   ####   ',
    '    ##    ',
    '   ####   ',
    '  ##  ##  ',
    '  ######  ',
  ]},
  lamp:{ name:'Floor Lamp', glow:true, art:[
    '  ####  ',
    ' #++++# ',
    ' #++++# ',
    '  ####  ',
    '   ##   ',
    '   ##   ',
    '   ##   ',
    '   ##   ',
    '  ####  ',
    ' ###### ',
  ]},
  beanbag:{ name:'Beanbag', glow:false, art:[
    '  ####  ',
    ' #++++# ',
    '#++++++#',
    '#++++++#',
    '#++++++#',
    ' ###### ',
  ]},
  server:{ name:'Server Rack', glow:false, art:[
    '######',
    '#+##+#',
    '######',
    '#+##+#',
    '######',
    '#+##+#',
    '######',
    '#+##+#',
    '######',
  ]},
};
const TRAY_ORDER=['desk','bookshelf','plant','lamp','beanbag','server','rug'];

/* ---- pet sprite (16x16) — the only colour in the room ------- */
const PAL={'0':null,'1':'#5a2412','2':'#e8643c','3':'#f2956b','4':'#ffffff','5':'#2a2a2a','6':'#3aa0c0'};
const PET=[
  '................',
  '......2222......',
  '.....122222.1...',
  '....1222222221..',
  '....1222222221..',
  '...122222222221.',
  '...124422442221.',  /* eyes (white) */
  '...125522552221.',  /* pupils       */
  '...122222222221.',
  '...123333333321.',  /* belly        */
  '....1233333321..',
  '....1222222221..',
  '.....12222221...',
  '....1.1..1.1....',  /* little legs  */
  '...1..1..1..1...',
  '................',
];
function drawPet(cv, bob){
  const px=4, S=16;
  cv.width=S*px; cv.height=S*px;
  const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  g.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const col=PAL[PET[y][x]]; if(!col) continue;
    g.fillStyle=col; g.fillRect(x*px,(y)*px,px,px);
  }
}

/* ============================================================
   BUILD ROOM
   ============================================================ */
const floor=$('#floor');
const placed={};   // key "c,r" -> {kind, el, shadowEl}
let selected=null; // tray selection

/* tiles */
for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
  const t=document.createElement('div');
  t.className='tile'; t.dataset.c=c; t.dataset.r=r;
  t.style.left=(c*TILE)+'px'; t.style.top=(r*TILE)+'px';
  t.addEventListener('click',()=>onTileClick(c,r));
  t.addEventListener('mouseenter',()=>{ if(selected) t.classList.add('hot'); });
  t.addEventListener('mouseleave',()=>t.classList.remove('hot'));
  floor.appendChild(t);
}

/* wall art */
const wallBack=$('#wallBack'), wallLeft=$('#wallLeft');
function buildWallArt(){
  wallBack.querySelectorAll('.window,.poster').forEach(e=>e.remove());
  wallLeft.querySelectorAll('.window,.poster').forEach(e=>e.remove());
  if(showWindow){
    const win=document.createElement('div'); win.className='window';
    win.style.cssText='left:46px;top:30px;width:120px;height:80px;';
    win.innerHTML='<div class="pane"></div><div class="moon"></div>';
    wallBack.appendChild(win);
  }
  if(showPoster){
    const p=document.createElement('div'); p.className='poster';
    p.style.cssText='position:absolute;left:70px;top:34px;width:64px;height:84px;background:#0d1a2c;box-shadow:inset 0 0 0 3px #1b2c44;';
    p.innerHTML='<div style="position:absolute;left:8px;top:10px;right:8px;height:44px;background:#1f4f7a;"></div>'+
                '<div style="position:absolute;left:18px;bottom:14px;width:28px;height:8px;background:#ffd83d;"></div>';
    wallLeft.appendChild(p);
  }
}

/* place / remove objects */
function placeObject(kind,c,r){
  const key=c+','+r;
  if(placed[key]) removeObject(c,r);
  const cx=(c+0.5)*TILE, cy=(r+0.5)*TILE;

  if(kind==='rug'){
    const rug=document.createElement('div'); rug.className='rug';
    rug.style.cssText=`left:${cx}px;top:${cy}px;width:${TILE*0.82}px;height:${TILE*0.82}px;`;
    rug.addEventListener('click',e=>{e.stopPropagation();removeObject(c,r);});
    floor.appendChild(rug);
    placed[key]={kind,el:rug}; updateNeeds(); return;
  }

  const def=DEFS[kind];
  // ground shadow (flat on floor)
  const sh=document.createElement('div'); sh.className='shadow';
  sh.style.left=cx+'px'; sh.style.top=cy+'px';
  floor.appendChild(sh);

  // billboard standee
  const obj=document.createElement('div'); obj.className='obj';
  obj.style.left=cx+'px'; obj.style.top=cy+'px';
  const card=document.createElement('div'); card.className='card';
  if(def.glow){ const gl=document.createElement('div'); gl.className='glow'; card.appendChild(gl); }
  card.appendChild(dotArt(def.art));
  const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=def.name; card.appendChild(lbl);
  card.addEventListener('click',e=>{e.stopPropagation();removeObject(c,r);});
  obj.appendChild(card);
  floor.appendChild(obj);

  placed[key]={kind,el:obj,shadowEl:sh};
  updateNeeds();
}
function removeObject(c,r){
  const key=c+','+r, p=placed[key]; if(!p) return;
  p.el.remove(); if(p.shadowEl) p.shadowEl.remove();
  delete placed[key]; updateNeeds();
}
function onTileClick(c,r){
  if(!selected) return;
  const key=c+','+r;
  if(placed[key]) removeObject(c,r); else placeObject(selected,c,r);
}

/* ---- tray UI ---- */
const tray=$('#tray');
TRAY_ORDER.forEach(kind=>{
  const b=document.createElement('button'); b.dataset.kind=kind;
  const icon = kind==='rug'
    ? dotArt(['########','#++++++#','#+####+#','#++++++#','########'],4,1.5)
    : dotArt(DEFS[kind].art,3,1.2);
  b.appendChild(icon);
  const t=document.createElement('div'); t.className='t';
  t.textContent = kind==='rug'?'Rug':DEFS[kind].name.split(' ')[0];
  b.appendChild(t);
  b.addEventListener('click',()=>{
    selected = selected===kind?null:kind;
    [...tray.children].forEach(x=>x.classList.toggle('active',x.dataset.kind===selected));
  });
  tray.appendChild(b);
});

/* ---- needs (cosmetic, driven a little by room contents) ---- */
const NEEDS=[
  {k:'hunger',l:'Hunger',base:62},
  {k:'energy',l:'Energy',base:74},
  {k:'happiness',l:'Happiness',base:58},
  {k:'hygiene',l:'Hygiene',base:80},
];
const needsBox=$('#needs');
NEEDS.forEach(n=>{
  const d=document.createElement('div'); d.className='need';
  d.innerHTML=`<div class="row"><span>${n.l}</span><span id="nv_${n.k}">${n.base}</span></div>
    <div class="bar"><div class="fill" id="nf_${n.k}"></div></div>`;
  needsBox.appendChild(d);
});
function updateNeeds(){
  // a furnished room nudges happiness up — just to feel alive
  const count=Object.keys(placed).length;
  const happy=Math.min(100, NEEDS[2].base + count*5);
  const vals={hunger:NEEDS[0].base,energy:NEEDS[1].base,happiness:happy,hygiene:NEEDS[3].base};
  for(const k in vals){
    $('#nf_'+k).style.width=vals[k]+'%';
    $('#nv_'+k).textContent=vals[k];
    $('#nf_'+k).style.background = vals[k]<25?'#ff5e62':vals[k]<55?'#ffb347':'var(--dot-on)';
  }
}

/* ============================================================
   PET — wanders the floor, billboarded, speaks now and then
   ============================================================ */
const petEl=document.createElement('div'); petEl.className='pet';
const petCv=document.createElement('canvas');
const speech=document.createElement('div'); speech.className='speech';
petEl.appendChild(petCv); petEl.appendChild(speech);
floor.appendChild(petEl);
let petTile={c:2,r:2};
function movePet(c,r){
  petTile={c,r};
  petEl.style.left=((c+0.5)*TILE)+'px';
  petEl.style.top=((r+0.5)*TILE)+'px';
}
movePet(2,2);
drawPet(petCv,0);
const LINES=['hello there!',"let's build!",'cozy in here','feed me?','♫ vibing','nice room!','...thinking','ship it!'];
function say(){
  if(!motion) return;
  speech.textContent=LINES[Math.floor(Math.random()*LINES.length)];
  speech.classList.add('show');
  setTimeout(()=>speech.classList.remove('show'),2600);
}

/* wander loop */
let motion=true;
setInterval(()=>{
  if(!motion) return;
  for(let i=0;i<8;i++){
    const c=Math.floor(Math.random()*GRID), r=Math.floor(Math.random()*GRID);
    if(!placed[c+','+r]){ movePet(c,r); break; }
  }
},1900);
setInterval(()=>{ if(Math.random()<0.5) say(); },4200);
/* idle bob */
let bobT=0;
function bobLoop(){
  if(motion){ bobT+=0.06; petCv.style.transform=`translate(-50%,-100%) translateY(${Math.sin(bobT)*2}px)`; }
  requestAnimationFrame(bobLoop);
}
bobLoop();

/* ============================================================
   ORBIT (drag) + PARALLAX + CONTROLS
   ============================================================ */
const root=document.documentElement.style;
let ax=58, az=-45;
function applyView(){ root.setProperty('--ax',ax+'deg'); root.setProperty('--az',az+'deg'); }
applyView();

const scene=$('#scene');
let dragging=false, lastX=0, lastY=0;
scene.addEventListener('pointerdown',e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  scene.classList.add('dragging'); document.body.classList.add('no-trans');
  scene.setPointerCapture(e.pointerId);
});
scene.addEventListener('pointermove',e=>{
  if(!dragging) return;
  az = clamp(az + (e.clientX-lastX)*0.3, -72, -18);
  ax = clamp(ax - (e.clientY-lastY)*0.2, 46, 68);
  lastX=e.clientX; lastY=e.clientY;
  $('#tilt').value=Math.round(ax); $('#tiltVal').textContent=Math.round(ax);
  applyView();
});
function endDrag(){ dragging=false; scene.classList.remove('dragging'); document.body.classList.remove('no-trans'); }
scene.addEventListener('pointerup',endDrag);
scene.addEventListener('pointercancel',endDrag);

/* gentle parallax when idle */
scene.addEventListener('mousemove',e=>{
  if(dragging) return;
  const rect=scene.getBoundingClientRect();
  const dx=(e.clientX-rect.left)/rect.width-0.5;
  root.setProperty('--az',(az + dx*6)+'deg');
});
scene.addEventListener('mouseleave',()=>root.setProperty('--az',az+'deg'));

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* time of day */
const tod=$('#tod'), todVal=$('#todVal');
function setTod(v){
  const t=v/100;                 // 0 = bright day, 1 = night
  root.setProperty('--tint',t);
  todVal.textContent = t<0.2?'DAY':t<0.45?'DUSK':t<0.7?'EVENING':'NIGHT';
}
tod.addEventListener('input',e=>setTod(+e.target.value));
setTod(+tod.value);

/* tilt slider */
$('#tilt').addEventListener('input',e=>{ ax=+e.target.value; $('#tiltVal').textContent=ax; applyView(); });

/* wall art toggles */
let showWindow=true, showPoster=true;
$('#tWindow').addEventListener('click',function(){ showWindow=!showWindow; this.classList.toggle('on',showWindow); buildWallArt(); });
$('#tPoster').addEventListener('click',function(){ showPoster=!showPoster; this.classList.toggle('on',showPoster); buildWallArt(); });
buildWallArt();

/* motion + reset */
$('#tMotion').addEventListener('click',function(){ motion=!motion; this.classList.toggle('on',motion); });
$('#tReset').addEventListener('click',()=>{
  Object.keys(placed).forEach(k=>{const[c,r]=k.split(',').map(Number);removeObject(c,r);});
  seedRoom();
});

/* ---- starter furniture so the room reads on load ---- */
function seedRoom(){
  placeObject('rug',2,2);
  placeObject('desk',1,0);
  placeObject('bookshelf',0,1);
  placeObject('plant',4,0);
  placeObject('lamp',0,4);
  placeObject('beanbag',4,4);
  placeObject('server',4,2);
  movePet(2,3);
  updateNeeds();
}
seedRoom();

/* reduced motion respect */
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  motion=false; $('#tMotion').classList.remove('on');
}
</script>
</body>
</html>
